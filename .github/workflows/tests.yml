name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: 'none', testbench: '' }
          - { php: '8.4', laravel: 'none', testbench: '' }
          - { php: '8.1', laravel: '10',   testbench: '^8.0' }
          - { php: '8.2', laravel: '11',   testbench: '^9.0' }
          - { php: '8.3', laravel: '12',   testbench: '^10.0' }
          - { php: '8.4', laravel: '13',   testbench: '^11.0' }
    name: PHP ${{ matrix.php }} / ${{ matrix.laravel == 'none' && 'plain PHP' || format('Laravel {0}', matrix.laravel) }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring
          coverage: none

      - name: Select Laravel version
        run: |
          if [ "${{ matrix.laravel }}" = "none" ]; then
            composer remove orchestra/testbench --dev --no-update --no-interaction
          else
            composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          fi

      - run: composer update --no-interaction --no-progress --prefer-dist

      - name: Installed framework
        run: composer show laravel/framework 2>/dev/null | grep -E '^versions' || echo "Laravel not installed"

      - run: composer test
